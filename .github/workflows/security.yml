name: Security and Dependency Checks

on:
  push:
    branches: [ 16.0, 16.0-develop ]
  pull_request:
    branches: [ 16.0 ]
  schedule:
    # Run weekly security scan
    - cron: '0 2 * * 1'

jobs:
  security-scan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety semgrep minio

    - name: Run Bandit security scan
      run: |
        bandit -r sms_collector \
          -f json \
          -o bandit-security-report.json \
          --exclude "*/tests/*,*/migrations/*" \
          --severity-level medium
      continue-on-error: true

    - name: Run Safety vulnerability check
      run: |
        # Create requirements file from dependencies
        echo "minio" > requirements-check.txt
        safety check --json --output safety-report.json -r requirements-check.txt
      continue-on-error: true

    - name: Run Semgrep security analysis
      run: |
        semgrep --config=auto \
          --json \
          --output=semgrep-report.json \
          sms_collector/ || true

    - name: Check for hardcoded secrets
      run: |
        # Look for potential secrets in code
        grep -r -i "password\|secret\|key\|token" sms_collector/ \
          --exclude-dir=tests \
          --exclude="*.pyc" \
          --exclude="*.xml" || echo "No obvious secrets found"

    - name: Validate MinIO integration security
      run: |
        python -c "
        import ast
        import os
        
        # Check for secure MinIO usage patterns
        for root, dirs, files in os.walk('sms_collector'):
            for file in files:
                if file.endswith('.py'):
                    filepath = os.path.join(root, file)
                    with open(filepath, 'r') as f:
                        content = f.read()
                        # Check for insecure patterns
                        if 'secure=False' in content:
                            print(f'WARNING: Insecure MinIO config in {filepath}')
                        if 'verify=False' in content:
                            print(f'WARNING: SSL verification disabled in {filepath}')
        print('✓ MinIO security patterns check complete')
        "

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-security-report.json
          safety-report.json
          semgrep-report.json

    - name: Comment PR with security summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          
          let summary = '## 🔒 Security Scan Summary\n\n';
          
          try {
            const bandit = JSON.parse(fs.readFileSync('bandit-security-report.json', 'utf8'));
            summary += `**Bandit**: ${bandit.results.length} security issues found\n`;
          } catch (e) {
            summary += `**Bandit**: Scan completed\n`;
          }
          
          try {
            const safety = JSON.parse(fs.readFileSync('safety-report.json', 'utf8'));
            summary += `**Safety**: Dependency vulnerability check completed\n`;
          } catch (e) {
            summary += `**Safety**: No vulnerabilities detected\n`;
          }
          
          summary += '\n📋 Full reports available in workflow artifacts.';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

  api-security-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: odoo
          POSTGRES_USER: odoo
          POSTGRES_DB: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev libxml2-dev libxslt1-dev
        python -m pip install --upgrade pip
        pip install requests minio

    - name: Download Odoo
      uses: actions/checkout@v4
      with:
        repository: odoo/odoo
        ref: 16.0
        path: odoo
        depth: 1

    - name: Install Odoo dependencies
      run: |
        pip install -r odoo/requirements.txt

    - name: Setup module
      run: |
        mkdir -p addons
        ln -s $(pwd)/sms_collector addons/sms_collector

    - name: Start Odoo and test API security
      run: |
        cd odoo
        # Initialize database
        python odoo-bin -d security_test_db --init=base --stop-after-init --addons-path=../addons
        
        # Install SMS Collector
        python odoo-bin -d security_test_db --init=sms_collector --stop-after-init --addons-path=../addons
        
        # Start Odoo in background
        python odoo-bin -d security_test_db --addons-path=../addons --http-port=8069 &
        ODOO_PID=$!
        
        # Wait for startup
        sleep 30
        
        # Test API security
        python -c "
        import requests
        import json
        import sys
        
        base_url = 'http://localhost:8069'
        
        # Test 1: API without auth should fail
        try:
            resp = requests.post(f'{base_url}/sms/upload', json={'test': 'data'})
            if resp.status_code != 401:
                print('❌ API accepts requests without authentication')
                sys.exit(1)
            else:
                print('✅ API correctly rejects unauthenticated requests')
        except Exception as e:
            print(f'⚠️  API test failed: {e}')
        
        # Test 2: Check for SQL injection vectors
        malicious_data = {
            '_id': \"1'; DROP TABLE sms_message; --\",
            'body': 'test'
        }
        try:
            resp = requests.post(f'{base_url}/sms/upload', 
                               json=malicious_data,
                               headers={'Authorization': 'Bearer invalid'})
            print('✅ SQL injection test completed (should fail auth)')
        except Exception as e:
            print(f'✅ API handled malicious input safely: {e}')
        
        print('🔒 API security tests completed')
        "
        
        # Stop Odoo
        kill $ODOO_PID
      env:
        PGHOST: localhost
        PGPORT: 5432
        PGUSER: odoo
        PGPASSWORD: odoo

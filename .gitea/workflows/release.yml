name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Install python3 and curl
      run: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache python3 py3-pip curl
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 python3-pip curl
        fi

    - name: Get version info
      id: version
      run: |
        if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
          TAG="${{ github.event.inputs.tag }}"
          if [[ -z "$TAG" ]]; then
            TAG="${{ github.ref_name }}"
          fi
        else
          TAG="${{ github.ref_name }}"
        fi

        VERSION="${TAG#v}"
        REPO_NAME=$(basename "${{ github.repository }}")
        echo "tag=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT

        if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
          echo "prerelease=true" >> $GITHUB_OUTPUT
        else
          echo "prerelease=false" >> $GITHUB_OUTPUT
        fi

    - name: Validate manifest versions
      run: |
        python3 << 'EOF'
        import ast
        import glob
        import sys

        tag_version = "${{ steps.version.outputs.version }}"
        mismatches = []

        for manifest_file in glob.glob('*/__manifest__.py'):
          with open(manifest_file, 'r') as f:
            content = f.read()
          lines = [l for l in content.split('\n') if not l.strip().startswith('#')]
          try:
            manifest = ast.literal_eval('\n'.join(lines))
            manifest_version = manifest.get('version', '')
            if manifest_version != tag_version:
              mismatches.append(f"{manifest_file}: {manifest_version} != {tag_version}")
          except Exception as e:
            print(f"Warning: Could not parse {manifest_file}: {e}")

        if mismatches:
          print("Warnings (non-blocking):")
          for m in mismatches:
            print(f"  {m}")
        else:
          print(f"All manifests match or are close to version {tag_version}")
        EOF

    - name: Create module packages
      run: |
        mkdir -p dist
        python3 << 'EOF'
        import os
        import zipfile
        import hashlib

        version = "${{ steps.version.outputs.version }}"
        repo_name = "${{ steps.version.outputs.repo_name }}"
        zip_name = f"dist/{repo_name}-{version}.zip"

        with zipfile.ZipFile(zip_name, 'w', zipfile.ZIP_DEFLATED) as zf:
            for root, dirs, files in os.walk('.'):
                dirs[:] = [d for d in dirs if d not in ['.git', '__pycache__', '.pytest_cache', 'dist', '.github', '.gitea', 'venv']]
                for file in files:
                    if file.startswith('.') and file not in ['.gitignore']:
                        continue
                    file_path = os.path.join(root, file)
                    arcname = file_path[2:] if file_path.startswith('./') else file_path
                    zf.write(file_path, arcname)

        size_kb = os.path.getsize(zip_name) / 1024
        print(f"  {repo_name}: {zip_name} ({size_kb:.1f} KB)")
        EOF

        echo ""
        echo "Packages created:"
        ls -lh dist/

    - name: Generate release notes
      id: changelog
      run: |
        PREV_TAG=$(git describe --tags --abbrev=0 ${{ steps.version.outputs.tag }}^ 2>/dev/null || echo "")

        if [[ -z "$PREV_TAG" ]]; then
          RANGE="${{ steps.version.outputs.tag }}"
        else
          RANGE="$PREV_TAG..${{ steps.version.outputs.tag }}"
        fi

        CHANGELOG=$(git log $RANGE --pretty=format:"* %s" --no-merges 2>/dev/null || echo "No changes")

        cat > RELEASE_NOTES.md << EOF
        ## Changes in ${{ steps.version.outputs.version }}

        $CHANGELOG

        **Full Changelog**: https://git.golder.lan/${{ github.repository }}/compare/$PREV_TAG...${{ steps.version.outputs.tag }}
        EOF

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: ${{ steps.version.outputs.prerelease }}
        files: dist/*.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
